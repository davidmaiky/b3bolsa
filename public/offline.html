<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Sem conexão · Carteira Global</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #e6edf3; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 22rem; padding: 1.5rem; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.15rem; margin: 1rem 0 .5rem; }
    p { color: #8b98a8; font-size: .9rem; line-height: 1.5; margin: 0 0 1.25rem; }
    button { background: #3b82f6; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>Sem conexão</h1>
    <p>Não consegui falar com o servidor. Por segurança, o app não guarda seus dados financeiros no aparelho: conecte-se à internet e tente de novo.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
